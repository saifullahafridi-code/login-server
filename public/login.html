<!DOCTYPE html>
<html>

<head>
  <title>Login Form</title>
  <style>
    .container {
      width: 300px;
      margin: 100px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #f5f5f5;
    }

    .heading {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 14px;
      border: 1px solid #999;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #333;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <form action="/login" method="POST">
    <div class="container">
      <div class="heading">Login</div>
      <div><input type="email" name="email" placeholder="Email"></div>
      <div><input type="password" name="password" placeholder="Password"></div>
      <div><button type="submit">Login</button></div>
    </div>
  </form>

</body>

</html>
